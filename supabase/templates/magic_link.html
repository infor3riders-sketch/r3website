<!doctype html>
<html><body style="margin:0;background:#0b0b0c;font-family:Arial,Helvetica,sans-serif;color:#ffffff;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b0b0c;padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;background:#151515;border:1px solid #6b4a0a;border-radius:8px;">
        <tr><td style="padding:28px 32px 8px;text-align:center;">
          <div style="font-size:13px;letter-spacing:4px;color:#f2a81d;text-transform:uppercase;">R3 Riders</div>
          <h1 style="margin:12px 0 0;font-size:26px;text-transform:uppercase;letter-spacing:1px;">Your sign-in link</h1>
        </td></tr>
        <tr><td style="padding:16px 32px 8px;font-size:15px;line-height:1.6;color:#d6d6d6;">Use the button below to sign in to the R3 Riders member portal. The link works once.</td></tr>
        <tr><td align="center" style="padding:16px 32px 28px;">
          <!-- RedirectTo always carries a query string (?next=...), so the token is appended with & -->
          <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=magiclink"
             style="display:inline-block;background:#f2a81d;color:#000000;font-weight:bold;text-transform:uppercase;letter-spacing:1px;text-decoration:none;padding:14px 28px;border-radius:6px;">Sign in</a>
        </td></tr>
        <tr><td style="padding:0 32px 28px;font-size:12px;color:#8a8a8a;text-align:center;">
          If you did not expect this email you can ignore it. Ride. Connect. Support.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body></html>
